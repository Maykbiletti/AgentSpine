name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, verify, and attest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Require the tagged commit on main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install exactly locked dependencies
        run: npm ci
      - name: Run all quality and preservation gates
        run: npm run check
      - name: Validate release metadata and package boundary
        run: npm run release:check -- --tag "$GITHUB_REF_NAME"
      - name: Build package, SBOM, and checksums
        id: package
        shell: bash
        run: |
          mkdir dist
          package_name="$(npm pack --ignore-scripts --pack-destination dist)"
          package_path="dist/${package_name}"
          sbom_path="dist/${package_name%.tgz}.cdx.json"
          npm sbom --sbom-format cyclonedx > "$sbom_path"
          (cd dist && sha256sum "$package_name" "$(basename "$sbom_path")" > SHA256SUMS)
          echo "package=${package_path}" >> "$GITHUB_OUTPUT"
          echo "sbom=${sbom_path}" >> "$GITHUB_OUTPUT"
      - name: Attest package build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.package.outputs.package }}
      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.package.outputs.package }}
          sbom-path: ${{ steps.package.outputs.sbom }}
      - name: Upload verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish-github:
    name: Publish immutable GitHub release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download attested release bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-${{ github.ref_name }}
          path: dist
      - name: Create release from the immutable tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "AgentSpine $GITHUB_REF_NAME"
          --notes-from-tag
